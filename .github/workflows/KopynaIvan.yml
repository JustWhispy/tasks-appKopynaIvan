name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/${{ matrix.service }}/requirements.txt
          python -m pip install bandit==1.9.4

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v 2>&1 | tee test-report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-test-report
          path: services/${{ matrix.service }}/test-report.txt
          if-no-files-found: error

      - name: Run Bandit
        if: always()
        run: |
          python -m bandit -r services/${{ matrix.service }}/app \
            -f html \
            -o services/${{ matrix.service }}/bandit-report.html

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-bandit-report
          path: services/${{ matrix.service }}/bandit-report.html
          if-no-files-found: error

  deploy:
    pull_request:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: '*-report'
          path: _site

      - name: Create report index
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Python CI reports</title>
          </head>
          <body>
            <h1>Python CI reports</h1>
            <h2>tasks-api</h2>
            <ul>
              <li><a href="tasks-api-test-report/test-report.txt">Tests</a></li>
              <li><a href="tasks-api-bandit-report/bandit-report.html">Bandit</a></li>
            </ul>
            <h2>title-normalizer</h2>
            <ul>
              <li><a href="title-normalizer-test-report/test-report.txt">Tests</a></li>
              <li><a href="title-normalizer-bandit-report/bandit-report.html">Bandit</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t tasks-api ./services/tasks-api
          docker build -t title-normalizer ./services/title-normalizer

      - name: Start containers
        run: |
          docker network create tasks-net

          docker run -d --name title-normalizer \
            --network tasks-net \
            -p 5001:5001 \
            title-normalizer

          docker run -d --name tasks-api \
            --network tasks-net \
            -p 5002:5000 \
            -e NORMALIZER_URL=http://title-normalizer:5001 \
            tasks-api

      - name: Wait for services
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:5001/health
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:5002/health


      - name: Check task normalization
        run: |
          curl --fail --silent --show-error \
            http://localhost:5002/tasks \
            -H 'Content-Type: application/json' \
            -d '{"title":"  buy   milk "}' \
            -o response.json

          cat response.json

          python3 - <<'PY'
          import json
          with open("response.json") as file:
              task = json.load(file)
          assert task["title"] == "Buy milk", task
          assert task["normalized"] is True, task
          PY

        
      - name: Show container logs
        if: always()
        run: |
          docker logs title-normalizer || true
          docker logs tasks-api || true
