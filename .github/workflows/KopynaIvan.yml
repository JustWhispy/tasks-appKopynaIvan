name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/${{ matrix.service }}/requirements.txt
          python -m pip install bandit==1.9.4

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v 2>&1 | tee test-report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-test-report
          path: services/${{ matrix.service }}/test-report.txt
          if-no-files-found: error

      - name: Run Bandit
        if: always()
        run: |
          python -m bandit -r services/${{ matrix.service }}/app \
            -f html \
            -o services/${{ matrix.service }}/bandit-report.html

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-bandit-report
          path: services/${{ matrix.service }}/bandit-report.html
          if-no-files-found: error

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id_token: write
    steps:
      - name: Download reports
        uses: actions/download-artifact@v8
        with:
          pattern: '*-report'
          path: _site

      - name: Create report index
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Python CI reports</title>
          </head>
          <body>
            <h1>Python CI reports</h1>
            <h2>tasks-api</h2>
            <ul>
              <li><a href="tasks-api-test-report/test-report.txt">Tests</a></li>
              <li><a href="tasks-api-bandit-report/bandit-report.html">Bandit</a></li>
            </ul>
            <h2>title-normalizer</h2>
            <ul>
              <li><a href="title-normalizer-test-report/test-report.txt">Tests</a></li>
              <li><a href="title-normalizer-bandit-report/bandit-report.html">Bandit</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
